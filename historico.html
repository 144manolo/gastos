<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Histórico 2022-2026 - Contabilidad MFB</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --neon-blue: #00f0ff; --neon-purple: #b026ff; --neon-pink: #ff2d95;
            --neon-green: #00ff88; --neon-red: #ff4757; --neon-yellow: #ffc107;
            --bg-dark: #0a0e1a; --bg-card: #111827; --text-primary: #ffffff;
            --text-secondary: #8892a4; --border-glow: rgba(0, 240, 255, 0.3);
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .app-container { max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; padding: 20px 16px 100px; background: linear-gradient(180deg, #0a0e1a 0%, #0d1225 50%, #0a0e1a 100%); }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 20px; }
        .back-btn { width: 48px; height: 48px; border: 1px solid var(--border-glow); border-radius: 12px; background: rgba(0, 240, 255, 0.05); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: all 0.3s; -webkit-tap-highlight-color: transparent; text-decoration: none; color: var(--neon-blue); }
        .back-btn:active { background: rgba(0, 240, 255, 0.2); transform: scale(0.95); }
        .app-title { text-align: center; flex: 1; }
        .app-title h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .app-title h2 { font-size: 12px; color: var(--neon-blue); letter-spacing: 3px; font-weight: 400; }
        .filter-section { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .filter-section h3 { font-size: 13px; color: var(--neon-blue); letter-spacing: 1px; margin-bottom: 12px; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-row select, .filter-row input { flex: 1; min-width: 100px; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: var(--text-primary); font-size: 13px; outline: none; }
        .filter-row select:focus, .filter-row input:focus { border-color: var(--neon-blue); }
        .filter-row select option { background: var(--bg-card); }
        
        /* ===== MULTI-SELECT PERSONALIZADO ===== */
        .multi-select { position: relative; width: 100%; margin-bottom: 10px; }
        .multi-select-header { 
            padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.05); color: var(--text-primary); font-size: 13px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            min-height: 42px; user-select: none;
        }
        .multi-select-header:active { background: rgba(0, 240, 255, 0.1); }
        .multi-select-header .arrow { transition: transform 0.3s; font-size: 10px; }
        .multi-select-header.open .arrow { transform: rotate(180deg); }
        .multi-select-dropdown { 
            display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
            background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 8px;
            margin-top: 4px; max-height: 250px; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .multi-select-dropdown.open { display: block; }
        .multi-select-search { 
            width: 100%; padding: 8px 12px; border: none; border-bottom: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: var(--text-primary); font-size: 13px; outline: none;
        }
        .multi-select-search:focus { border-bottom-color: var(--neon-blue); }
        .multi-select-actions { 
            display: flex; gap: 4px; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .multi-select-actions button { 
            flex: 1; padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: var(--text-secondary); font-size: 11px;
            cursor: pointer;
        }
        .multi-select-actions button:active { background: rgba(0, 240, 255, 0.1); color: var(--neon-blue); }
        .multi-select-option { 
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .multi-select-option:last-child { border-bottom: none; }
        .multi-select-option:active { background: rgba(0, 240, 255, 0.05); }
        .multi-select-option input[type="checkbox"] { 
            width: 18px; height: 18px; accent-color: var(--neon-blue); cursor: pointer;
        }
        .multi-select-option label { 
            flex: 1; font-size: 13px; cursor: pointer; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .multi-select-option .count { 
            font-size: 10px; color: var(--text-secondary); background: rgba(255,255,255,0.05);
            padding: 2px 6px; border-radius: 10px;
        }
        
        .summary-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .summary-card { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 14px; text-align: center; }
        .summary-card .label { font-size: 10px; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 6px; }
        .summary-card .value { font-size: 18px; font-weight: 700; }
        .summary-card.income .value { color: var(--neon-blue); }
        .summary-card.expense .value { color: var(--neon-pink); }
        .summary-card.balance .value { color: var(--neon-green); }
        .chart-card { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .chart-container { height: 200px; position: relative; }
        .transactions-list { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px; max-height: 500px; overflow-y: auto; }
        .transactions-list h3 { font-size: 13px; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 14px; position: sticky; top: 0; background: var(--bg-card); padding-bottom: 8px; z-index: 1; }
        .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); gap: 10px; cursor: pointer; }
        .transaction-item:active { background: rgba(255, 255, 255, 0.03); }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-info { flex: 1; min-width: 0; }
        .transaction-info h4 { font-size: 14px; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .transaction-info span { font-size: 11px; color: var(--text-secondary); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .transaction-amount { font-size: 14px; font-weight: 600; white-space: nowrap; }
        .transaction-amount.negative { color: var(--neon-red); }
        .transaction-amount.positive { color: var(--neon-green); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 200; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 20px 20px 0 0; width: 100%; max-width: 430px; max-height: 85vh; overflow-y: auto; padding: 24px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h3 { font-size: 18px; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .modal-close { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.1); background: transparent; color: var(--text-secondary); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-close:active { background: rgba(255, 255, 255, 0.1); }
        .view-modal-image { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; margin-bottom: 16px; background: rgba(0,0,0,0.3); cursor: pointer; }
        .view-detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 12px; }
        .view-detail-label { color: var(--text-secondary); font-size: 12px; flex-shrink: 0; }
        .view-detail-value { font-size: 14px; font-weight: 500; text-align: right; word-break: break-word; }
        .results-count { font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; text-align: center; }
        .day-group { margin-bottom: 20px; }
        .day-header { font-size: 12px; color: var(--neon-blue); letter-spacing: 1px; padding: 8px 0; border-bottom: 1px solid rgba(0, 240, 255, 0.2); margin-bottom: 8px; font-weight: 600; display: flex; justify-content: space-between; }
        .day-total { color: var(--text-secondary); font-weight: 400; }
        .active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .active-filter-tag { 
            padding: 4px 10px; border-radius: 12px; background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-blue); color: var(--neon-blue); font-size: 11px;
            display: flex; align-items: center; gap: 4px;
        }
        .active-filter-tag .remove { cursor: pointer; font-weight: bold; }
        @media (max-width: 430px) { .app-container { padding: 16px 12px 100px; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <div class="app-title">
                <h1>HISTÓRICO</h1>
                <h2>2022-2026</h2>
            </div>
            <div style="width: 48px;"></div>
        </div>

        <!-- Filtros -->
        <div class="filter-section">
            <h3>🔍 FILTROS</h3>
            
            <div class="filter-row">
                <select id="filterYear" onchange="applyFilters()">
                    <option value="">Todos los años</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
                <select id="filterMonth" onchange="applyFilters()">
                    <option value="">Todos los meses</option>
                    <option value="0">Enero</option>
                    <option value="1">Febrero</option>
                    <option value="2">Marzo</option>
                    <option value="3">Abril</option>
                    <option value="4">Mayo</option>
                    <option value="5">Junio</option>
                    <option value="6">Julio</option>
                    <option value="7">Agosto</option>
                    <option value="8">Septiembre</option>
                    <option value="9">Octubre</option>
                    <option value="10">Noviembre</option>
                    <option value="11">Diciembre</option>
                </select>
            </div>

            <!-- Multi-select Categorías -->
            <div class="multi-select" id="categoryMultiSelect">
                <div class="multi-select-header" onclick="toggleMultiSelect('category')">
                    <span id="categoryHeader">Todas las categorías</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="multi-select-dropdown" id="categoryDropdown">
                    <input type="text" class="multi-select-search" placeholder="🔍 Buscar categoría..." oninput="filterMultiSelectOptions('category', this.value)">
                    <div class="multi-select-actions">
                        <button onclick="selectAllOptions('category')">✓ Todas</button>
                        <button onclick="deselectAllOptions('category')">✕ Ninguna</button>
                    </div>
                    <div id="categoryOptions"></div>
                </div>
            </div>

            <!-- Multi-select Subcategorías -->
            <div class="multi-select" id="subcategoryMultiSelect">
                <div class="multi-select-header" onclick="toggleMultiSelect('subcategory')">
                    <span id="subcategoryHeader">Todas las subcategorías</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="multi-select-dropdown" id="subcategoryDropdown">
                    <input type="text" class="multi-select-search" placeholder="🔍 Buscar subcategoría..." oninput="filterMultiSelectOptions('subcategory', this.value)">
                    <div class="multi-select-actions">
                        <button onclick="selectAllOptions('subcategory')">✓ Todas</button>
                        <button onclick="deselectAllOptions('subcategory')">✕ Ninguna</button>
                    </div>
                    <div id="subcategoryOptions"></div>
                </div>
            </div>

            <div class="filter-row">
                <input type="text" id="filterDescription" placeholder="Buscar por descripción..." oninput="applyFilters()">
            </div>

            <!-- Filtros activos -->
            <div id="activeFilters" class="active-filters"></div>
        </div>

        <!-- Resumen -->
        <div class="summary-cards">
            <div class="summary-card income">
                <div class="label">INGRESOS</div>
                <div class="value" id="totalIncome">0€</div>
            </div>
            <div class="summary-card expense">
                <div class="label">GASTOS</div>
                <div class="value" id="totalExpense">0€</div>
            </div>
            <div class="summary-card balance">
                <div class="label">BALANCE</div>
                <div class="value" id="totalBalance">0€</div>
            </div>
        </div>

        <!-- Gráfico -->
        <div class="chart-card">
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <!-- Lista de transacciones -->
        <div class="transactions-list">
            <h3 id="transactionsTitle">TRANSACCIONES</h3>
            <div id="resultsCount" class="results-count"></div>
            <div id="transactionsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div>Cargando datos...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de visualización -->
    <div class="modal-overlay" id="viewModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="viewModalTitle">DETALLES</h3>
                <button class="modal-close" onclick="closeViewModal()">✕</button>
            </div>
            <div id="viewModalImageContainer"></div>
            <div id="viewModalContent"></div>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN =====
        const JSON_URL = 'datos-2022-2026.json';

        let allTransactions = [];
        let filteredTransactions = [];
        let categories = {};
        let mainChart = null;
        
        // Estado de los multi-select
        let selectedCategories = new Set();
        let selectedSubcategories = new Set();
        let allCategoriesList = [];
        let allSubcategoriesList = [];

        // ===== CONVERSIÓN DE URLS =====
        function convertToImageUrl(url) {
            if (!url) return null;
            url = url.trim();
            const driveMatch1 = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (driveMatch1) return `https://lh3.googleusercontent.com/d/${driveMatch1[1]}`;
            const driveMatch2 = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
            if (driveMatch2) return `https://lh3.googleusercontent.com/d/${driveMatch2[1]}`;
            const driveMatch3 = url.match(/drive\.google\.com\/uc\?.*id=([a-zA-Z0-9_-]+)/);
            if (driveMatch3) return `https://lh3.googleusercontent.com/d/${driveMatch3[1]}`;
            return url;
        }

        // ===== MULTI-SELECT =====
        function toggleMultiSelect(type) {
            const dropdown = document.getElementById(type + 'Dropdown');
            const header = dropdown.previousElementSibling;
            const isOpen = dropdown.classList.contains('open');
            
            // Cerrar todos los dropdowns
            document.querySelectorAll('.multi-select-dropdown').forEach(d => d.classList.remove('open'));
            document.querySelectorAll('.multi-select-header').forEach(h => h.classList.remove('open'));
            
            // Abrir el seleccionado si estaba cerrado
            if (!isOpen) {
                dropdown.classList.add('open');
                header.classList.add('open');
            }
        }

        function populateMultiSelectOptions() {
            // Categorías
            const catContainer = document.getElementById('categoryOptions');
            catContainer.innerHTML = allCategoriesList.map(cat => `
                <div class="multi-select-option" data-value="${escapeHtml(cat)}">
                    <input type="checkbox" id="cat-${escapeHtml(cat)}" value="${escapeHtml(cat)}" 
                           ${selectedCategories.has(cat) ? 'checked' : ''} 
                           onchange="toggleCategorySelection('${escapeHtml(cat)}')">
                    <label for="cat-${escapeHtml(cat)}">${escapeHtml(cat)}</label>
                    <span class="count">${allTransactions.filter(t => t.category === cat).length}</span>
                </div>
            `).join('');
            
            // Subcategorías
            const subContainer = document.getElementById('subcategoryOptions');
            subContainer.innerHTML = allSubcategoriesList.map(sub => `
                <div class="multi-select-option" data-value="${escapeHtml(sub)}">
                    <input type="checkbox" id="sub-${escapeHtml(sub)}" value="${escapeHtml(sub)}"
                           ${selectedSubcategories.has(sub) ? 'checked' : ''}
                           onchange="toggleSubcategorySelection('${escapeHtml(sub)}')">
                    <label for="sub-${escapeHtml(sub)}">${escapeHtml(sub)}</label>
                    <span class="count">${allTransactions.filter(t => t.subcategory === sub).length}</span>
                </div>
            `).join('');
        }

        function toggleCategorySelection(cat) {
            if (selectedCategories.has(cat)) {
                selectedCategories.delete(cat);
            } else {
                selectedCategories.add(cat);
            }
            updateMultiSelectHeader('category');
            applyFilters();
        }

        function toggleSubcategorySelection(sub) {
            if (selectedSubcategories.has(sub)) {
                selectedSubcategories.delete(sub);
            } else {
                selectedSubcategories.add(sub);
            }
            updateMultiSelectHeader('subcategory');
            applyFilters();
        }

        function selectAllOptions(type) {
            const list = type === 'category' ? allCategoriesList : allSubcategoriesList;
            const set = type === 'category' ? selectedCategories : selectedSubcategories;
            list.forEach(item => set.add(item));
            
            // Actualizar checkboxes visibles
            document.querySelectorAll(`#${type}Options input[type="checkbox"]`).forEach(cb => {
                cb.checked = true;
            });
            
            updateMultiSelectHeader(type);
            applyFilters();
        }

        function deselectAllOptions(type) {
            const set = type === 'category' ? selectedCategories : selectedSubcategories;
            set.clear();
            
            document.querySelectorAll(`#${type}Options input[type="checkbox"]`).forEach(cb => {
                cb.checked = false;
            });
            
            updateMultiSelectHeader(type);
            applyFilters();
        }

        function updateMultiSelectHeader(type) {
            const set = type === 'category' ? selectedCategories : selectedSubcategories;
            const header = document.getElementById(type + 'Header');
            
            if (set.size === 0) {
                header.textContent = type === 'category' ? 'Todas las categorías' : 'Todas las subcategorías';
            } else if (set.size === 1) {
                header.textContent = Array.from(set)[0];
            } else {
                header.textContent = `${set.size} seleccionadas`;
            }
            
            // Actualizar checkboxes en el DOM
            document.querySelectorAll(`#${type}Options input[type="checkbox"]`).forEach(cb => {
                cb.checked = set.has(cb.value);
            });
        }

        function filterMultiSelectOptions(type, searchTerm) {
            const options = document.querySelectorAll(`#${type}Options .multi-select-option`);
            const term = searchTerm.toLowerCase();
            
            options.forEach(opt => {
                const value = opt.dataset.value.toLowerCase();
                opt.style.display = value.includes(term) ? 'flex' : 'none';
            });
        }

        function updateActiveFilters() {
            const container = document.getElementById('activeFilters');
            const tags = [];
            
            selectedCategories.forEach(cat => {
                tags.push(`<span class="active-filter-tag">${escapeHtml(cat)} <span class="remove" onclick="removeCategoryFilter('${escapeHtml(cat)}')">✕</span></span>`);
            });
            
            selectedSubcategories.forEach(sub => {
                tags.push(`<span class="active-filter-tag">${escapeHtml(sub)} <span class="remove" onclick="removeSubcategoryFilter('${escapeHtml(sub)}')">✕</span></span>`);
            });
            
            container.innerHTML = tags.join('');
        }

        function removeCategoryFilter(cat) {
            selectedCategories.delete(cat);
            updateMultiSelectHeader('category');
            applyFilters();
        }

        function removeSubcategoryFilter(sub) {
            selectedSubcategories.delete(sub);
            updateMultiSelectHeader('subcategory');
            applyFilters();
        }

        // Cerrar dropdowns al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.multi-select')) {
                document.querySelectorAll('.multi-select-dropdown').forEach(d => d.classList.remove('open'));
                document.querySelectorAll('.multi-select-header').forEach(h => h.classList.remove('open'));
            }
        });

        // ===== CARGA DE DATOS =====
        async function loadData() {
            try {
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error(`Error ${response.status}`);
                const data = await response.json();
                
                allTransactions = data.transactions || [];
                categories = data.categories || {};
                
                // Extraer listas únicas
                const catSet = new Set();
                const subSet = new Set();
                allTransactions.forEach(t => {
                    if (t.category) catSet.add(t.category);
                    if (t.subcategory) subSet.add(t.subcategory);
                });
                allCategoriesList = Array.from(catSet).sort();
                allSubcategoriesList = Array.from(subSet).sort();
                
                populateMultiSelectOptions();
                applyFilters();
            } catch (error) {
                console.error('Error al cargar datos:', error);
                document.getElementById('transactionsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <div>Error al cargar datos</div>
                        <div style="font-size: 11px; margin-top: 8px;">${error.message}</div>
                    </div>
                `;
            }
        }

        function applyFilters() {
            const year = document.getElementById('filterYear').value;
            const month = document.getElementById('filterMonth').value;
            const description = document.getElementById('filterDescription').value.toLowerCase();
            
            filteredTransactions = allTransactions.filter(t => {
                const date = new Date(t.date + 'T00:00:00');
                
                if (year && date.getFullYear() !== parseInt(year)) return false;
                if (month !== '' && date.getMonth() !== parseInt(month)) return false;
                
                // Filtro de categorías (OR: cualquiera de las seleccionadas)
                if (selectedCategories.size > 0 && !selectedCategories.has(t.category)) return false;
                
                // Filtro de subcategorías (OR: cualquiera de las seleccionadas)
                if (selectedSubcategories.size > 0 && !selectedSubcategories.has(t.subcategory)) return false;
                
                // Filtro de descripción
                if (description) {
                    const searchIn = `${t.description} ${t.category} ${t.subcategory}`.toLowerCase();
                    if (!searchIn.includes(description)) return false;
                }
                
                return true;
            });
            
            filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            updateSummary();
            updateChart();
            renderTransactions();
            updateActiveFilters();
        }

        function updateSummary() {
            const totalIncome = filteredTransactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const totalExpense = filteredTransactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const balance = totalIncome - totalExpense;
            
            document.getElementById('totalIncome').textContent = `${totalIncome.toLocaleString('es-ES', {minimumFractionDigits: 2})}€`;
            document.getElementById('totalExpense').textContent = `${totalExpense.toLocaleString('es-ES', {minimumFractionDigits: 2})}€`;
            document.getElementById('totalBalance').textContent = `${balance.toLocaleString('es-ES', {minimumFractionDigits: 2})}€`;
        }

        function updateChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            const monthlyData = {};
            filteredTransactions.forEach(t => {
                const date = new Date(t.date + 'T00:00:00');
                const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                if (!monthlyData[key]) monthlyData[key] = { income: 0, expense: 0 };
                if (t.type === 'income') monthlyData[key].income += t.amount;
                else monthlyData[key].expense += t.amount;
            });
            
            const labels = Object.keys(monthlyData).sort();
            const incomeData = labels.map(k => monthlyData[k].income);
            const expenseData = labels.map(k => monthlyData[k].expense);
            
            if (mainChart) mainChart.destroy();
            
            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.map(l => {
                        const [y, m] = l.split('-');
                        return `${m}/${y}`;
                    }),
                    datasets: [
                        { label: 'Ingresos', data: incomeData, backgroundColor: 'rgba(0, 240, 255, 0.5)', borderColor: '#00f0ff', borderWidth: 2 },
                        { label: 'Gastos', data: expenseData, backgroundColor: 'rgba(255, 45, 149, 0.5)', borderColor: '#ff2d95', borderWidth: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#8892a4', font: { size: 11 } } } },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8892a4', font: { size: 9 } } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8892a4', font: { size: 10 }, callback: v => v + '€' } }
                    }
                }
            });
        }

        function renderTransactions() {
            const container = document.getElementById('transactionsContainer');
            const countEl = document.getElementById('resultsCount');
            
            countEl.textContent = `${filteredTransactions.length} de ${allTransactions.length} transacciones`;
            
            if (filteredTransactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div>Sin resultados</div>
                        <div style="font-size: 11px; margin-top: 8px;">Prueba a cambiar los filtros</div>
                    </div>
                `;
                return;
            }
            
            const groups = {};
            filteredTransactions.forEach(t => {
                if (!groups[t.date]) groups[t.date] = [];
                groups[t.date].push(t);
            });
            
            let html = '';
            for (let date in groups) {
                const items = groups[date];
                const dayIncome = items.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
                const dayExpense = items.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
                const dayBalance = dayIncome - dayExpense;
                
                html += `<div class="day-group">
                    <div class="day-header">
                        <span>📅 ${formatDateFull(date)}</span>
                        <span class="day-total">${dayIncome > 0 ? '+' + dayIncome.toFixed(2) + '€' : ''} ${dayExpense > 0 ? '-' + dayExpense.toFixed(2) + '€' : ''} = ${dayBalance >= 0 ? '+' : ''}${dayBalance.toFixed(2)}€</span>
                    </div>`;
                
                items.forEach(t => {
                    const colorClass = t.type === 'income' ? 'positive' : 'negative';
                    const sign = t.type === 'income' ? '+' : '-';
                    html += `<div class="transaction-item" onclick="viewTransaction(${t.id})">
                        <div class="transaction-info">
                            <h4>${escapeHtml(t.description)}</h4>
                            <span>${escapeHtml(t.category)} ${t.subcategory !== t.category ? '→ ' + escapeHtml(t.subcategory) : ''}</span>
                        </div>
                        <div class="transaction-amount ${colorClass}">${sign}${t.amount.toLocaleString('es-ES', {minimumFractionDigits: 2})}€</div>
                    </div>`;
                });
                
                html += `</div>`;
            }
            
            container.innerHTML = html;
        }

        function viewTransaction(id) {
            const t = allTransactions.find(x => x.id === id);
            if (!t) return;
            
            const typeLabel = t.type === 'income' ? '📈 INGRESO' : '📉 GASTO';
            const typeColor = t.type === 'income' ? 'var(--neon-blue)' : 'var(--neon-pink)';
            const sign = t.type === 'income' ? '+' : '-';
            
            document.getElementById('viewModalTitle').textContent = typeLabel;
            
            const imageContainer = document.getElementById('viewModalImageContainer');
            if (t.imageUrl) {
                const displayUrl = convertToImageUrl(t.imageUrl);
                imageContainer.innerHTML = `<img src="${displayUrl}" class="view-modal-image" alt="Imagen" onclick="window.open('${t.imageUrl}', '_blank')" onerror="this.style.display='none'">`;
            } else {
                imageContainer.innerHTML = '';
            }
            
            const dateFormatted = new Date(t.date + 'T00:00:00').toLocaleDateString('es-ES', { 
                weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' 
            });
            
            let content = `
                <div class="view-detail-row">
                    <span class="view-detail-label">💰 Monto</span>
                    <span class="view-detail-value" style="color: ${typeColor}; font-size: 18px;">${sign}${t.amount.toLocaleString('es-ES', {minimumFractionDigits: 2})}€</span>
                </div>
                <div class="view-detail-row">
                    <span class="view-detail-label">📝 Descripción</span>
                    <span class="view-detail-value">${escapeHtml(t.description)}</span>
                </div>
                <div class="view-detail-row">
                    <span class="view-detail-label">📂 Categoría</span>
                    <span class="view-detail-value">${escapeHtml(t.category)}</span>
                </div>
                <div class="view-detail-row">
                    <span class="view-detail-label">📁 Subcategoría</span>
                    <span class="view-detail-value">${escapeHtml(t.subcategory || '-')}</span>
                </div>
                <div class="view-detail-row">
                    <span class="view-detail-label">📅 Fecha</span>
                    <span class="view-detail-value">${dateFormatted}</span>
                </div>
            `;
            
            if (t.imageUrl) {
                content += `<div class="view-detail-row"><span class="view-detail-label">🔗 Imagen</span><span class="view-detail-value"><a href="${t.imageUrl}" target="_blank" style="color: var(--neon-blue);">Ver imagen original</a></span></div>`;
            }
            
            document.getElementById('viewModalContent').innerHTML = content;
            document.getElementById('viewModalOverlay').classList.add('active');
        }

        function closeViewModal() {
            document.getElementById('viewModalOverlay').classList.remove('active');
        }

        function escapeHtml(text) { 
            const div = document.createElement('div'); 
            div.textContent = text; 
            return div.innerHTML; 
        }
        
        function formatDateFull(dateStr) { 
            const date = new Date(dateStr + 'T00:00:00'); 
            return date.toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }); 
        }

        document.getElementById('viewModalOverlay').addEventListener('click', (e) => { 
            if (e.target === e.currentTarget) closeViewModal(); 
        });

        loadData();
    </script>
</body>
</html>
